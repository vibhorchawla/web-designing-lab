<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef2f7;
        }

        .weather-box {
            max-width: 500px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .weather-result {
            display: none;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="weather-box">

            <h1 class="text-center mb-2">Weather App</h1>
            <p class="text-center text-muted mb-4">
                Check the current weather of any city
            </p>

            <div class="input-group mb-3">
                <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
                <button class="btn btn-primary" onclick="getWeather()">Search</button>
            </div>

            <p id="message" class="text-center"></p>

            <div id="weatherResult" class="weather-result text-center">

                <h2 id="cityName"></h2>
                <p id="countryName" class="text-muted"></p>

                <div class="temperature">
                    <span id="temperature"></span>°C
                </div>

                <h4 id="condition"></h4>

                <div class="row mt-4">

                    <div class="col-6">
                        <div class="border rounded p-3">
                            <strong>Feels Like</strong>
                            <p id="feelsLike" class="mb-0"></p>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="border rounded p-3">
                            <strong>Humidity</strong>
                            <p id="humidity" class="mb-0"></p>
                        </div>
                    </div>

                    <div class="col-12 mt-3">
                        <div class="border rounded p-3">
                            <strong>Wind Speed</strong>
                            <p id="wind" class="mb-0"></p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        async function getWeather() {

            let city = document.getElementById("cityInput").value.trim();
            let message = document.getElementById("message");
            let result = document.getElementById("weatherResult");

            if (city === "") {
                message.innerHTML = "Please enter a city name.";
                message.className = "text-danger text-center";
                result.style.display = "none";
                return;
            }

            message.innerHTML = "Loading weather...";
            message.className = "text-primary text-center";

            try {

                let locationResponse = await fetch(
                    "https://geocoding-api.open-meteo.com/v1/search?name=" +
                    encodeURIComponent(city) +
                    "&count=1&language=en&format=json"
                );

                let locationData = await locationResponse.json();

                if (!locationData.results) {
                    throw new Error("City not found");
                }

                let location = locationData.results[0];

                let weatherResponse = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=" +
                    location.latitude +
                    "&longitude=" +
                    location.longitude +
                    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto"
                );

                let weatherData = await weatherResponse.json();

                document.getElementById("cityName").innerHTML = location.name;
                document.getElementById("countryName").innerHTML = location.country;

                document.getElementById("temperature").innerHTML =
                    weatherData.current.temperature_2m;

                document.getElementById("feelsLike").innerHTML =
                    weatherData.current.apparent_temperature + " °C";

                document.getElementById("humidity").innerHTML =
                    weatherData.current.relative_humidity_2m + "%";

                document.getElementById("wind").innerHTML =
                    weatherData.current.wind_speed_10m + " km/h";

                document.getElementById("condition").innerHTML =
                    getWeatherCondition(weatherData.current.weather_code);

                message.innerHTML = "";
                result.style.display = "block";

            } catch (error) {

                message.innerHTML = "City not found or something went wrong.";
                message.className = "text-danger text-center";
                result.style.display = "none";
            }
        }

        function getWeatherCondition(code) {

            if (code === 0) {
                return "Clear Sky";
            } else if (code >= 1 && code <= 3) {
                return "Cloudy";
            } else if (code === 45 || code === 48) {
                return "Foggy";
            } else if (code >= 51 && code <= 57) {
                return "Drizzle";
            } else if (code >= 61 && code <= 67) {
                return "Rainy";
            } else if (code >= 71 && code <= 77) {
                return "Snowy";
            } else if (code >= 80 && code <= 82) {
                return "Rain Showers";
            } else if (code >= 85 && code <= 86) {
                return "Snow Showers";
            } else if (code >= 95) {
                return "Thunderstorm";
            }

            return "Unknown";
        }
    </script>

</body>
</html>
