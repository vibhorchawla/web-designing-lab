
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Notes App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #f3f6fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #0d6efd;
        }

        .main-container {
            max-width: 850px;
        }

        .note-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .note-card:hover {
            transform: translateY(-3px);
        }

        .note-title {
            color: #0d6efd;
            overflow-wrap: anywhere;
        }

        .note-description {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .form-card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">My Notes App</span>
            <span class="text-white">React.js Application</span>
        </div>
    </nav>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [notes, setNotes] = useState([]);
            const [title, setTitle] = useState("");
            const [description, setDescription] = useState("");
            const [editId, setEditId] = useState(null);

            function handleSubmit(event) {
                event.preventDefault();

                if (!title.trim() || !description.trim()) {
                    alert("Please enter both title and description.");
                    return;
                }

                if (editId !== null) {
                    setNotes(notes.map(note =>
                        note.id === editId
                            ? { ...note, title: title.trim(), description: description.trim() }
                            : note
                    ));
                    setEditId(null);
                } else {
                    setNotes([
                        ...notes,
                        {
                            id: Date.now(),
                            title: title.trim(),
                            description: description.trim()
                        }
                    ]);
                }

                setTitle("");
                setDescription("");
            }

            function editNote(note) {
                setTitle(note.title);
                setDescription(note.description);
                setEditId(note.id);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            function deleteNote(id) {
                setNotes(notes.filter(note => note.id !== id));

                if (editId === id) {
                    setEditId(null);
                    setTitle("");
                    setDescription("");
                }
            }

            function cancelEdit() {
                setEditId(null);
                setTitle("");
                setDescription("");
            }

            return (
                <div className="container main-container py-5">
                    <div className="text-center mb-4">
                        <h1 className="fw-bold">My Notes</h1>
                        <p className="text-secondary">Create and manage your notes in one place.</p>
                    </div>

                    <div className="card form-card shadow-sm mb-5">
                        <div className="card-body p-4">
                            <h4 className="mb-4">
                                {editId !== null ? "Update Note" : "Add a New Note"}
                            </h4>

                            <form onSubmit={handleSubmit}>
                                <div className="mb-3">
                                    <label className="form-label">Note Title</label>
                                    <input
                                        type="text"
                                        className="form-control"
                                        placeholder="Enter note title"
                                        value={title}
                                        onChange={event => setTitle(event.target.value)}
                                    />
                                </div>

                                <div className="mb-3">
                                    <label className="form-label">Description</label>
                                    <textarea
                                        className="form-control"
                                        rows="4"
                                        placeholder="Write your note here..."
                                        value={description}
                                        onChange={event => setDescription(event.target.value)}
                                    ></textarea>
                                </div>

                                <button type="submit" className="btn btn-primary me-2">
                                    {editId !== null ? "Update Note" : "Add Note"}
                                </button>

                                {editId !== null && (
                                    <button
                                        type="button"
                                        className="btn btn-secondary"
                                        onClick={cancelEdit}
                                    >
                                        Cancel
                                    </button>
                                )}
                            </form>
                        </div>
                    </div>

                    <div className="d-flex justify-content-between align-items-center mb-3">
                        <h3 className="fw-bold mb-0">Saved Notes</h3>
                        <span className="badge bg-primary rounded-pill">
                            {notes.length} Notes
                        </span>
                    </div>

                    {notes.length === 0 ? (
                        <div className="alert alert-info text-center">
                            No notes yet. Add your first note above!
                        </div>
                    ) : (
                        <div className="row g-4">
                            {notes.map(note => (
                                <div className="col-md-6" key={note.id}>
                                    <div className="card note-card shadow-sm h-100">
                                        <div className="card-body p-4">
                                            <h5 className="note-title fw-bold">{note.title}</h5>
                                            <p className="note-description text-secondary mt-3">
                                                {note.description}
                                            </p>
                                            <div className="mt-4">
                                                <button
                                                    className="btn btn-warning btn-sm me-2"
                                                    onClick={() => editNote(note)}
                                                >
                                                    Edit
                                                </button>
                                                <button
                                                    className="btn btn-danger btn-sm"
                                                    onClick={() => deleteNote(note.id)}
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <footer className="text-center text-secondary mt-5">
                        <p>React.js Practical | Web Designing Lab</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
```
